<!-- multiquiz.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiQuiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>MultiQuiz Viewer</h1>
            <div class="controls">
                <div class="upload-area" id="dropZone">
                    <p> .multiquiz ファイルをここにドラッグ&ドロップ<br>または</p>
                    <label class="btn">
                        ファイルを選択
                        <input type="file" id="fileInput" accept=".multiquiz" style="display:none;">
                    </label>
                </div>
                <div class="url-load">
                    <input type="text" id="urlInput" placeholder="https://example.com/quiz.multiquiz">
                    <button id="loadUrlBtn">URLから読み込み</button>
                </div>
            </div>
        </header>

        <div id="quizContainer" class="hidden">
            <div class="quiz-header">
                <h2 id="quizTitle"></h2>
                <p id="quizDescription"></p>
                <div id="progress" class="progress"></div>
            </div>

            <div id="sections"></div>

            <div class="quiz-footer">
                <button id="submitAllBtn">全問回答を提出</button>
                <button id="resetBtn">リセット</button>
            </div>
        </div>

        <div id="errorMessage" class="hidden"></div>
    </div>

    <script src="scanner.js"></script>
    <script>
        let currentQuiz = null;
        let userAnswers = {};

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const urlInput = document.getElementById('urlInput');
        const loadUrlBtn = document.getElementById('loadUrlBtn');
        const quizContainer = document.getElementById('quizContainer');
        const errorMessage = document.getElementById('errorMessage');

        // Drag & Drop
        dropZone.addEventListener('dragover', e => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.name.endsWith('.multiquiz')) {
                loadFile(file);
            }
        });

        fileInput.addEventListener('change', e => {
            const file = e.target.files[0];
            if (file) loadFile(file);
        });

        loadUrlBtn.addEventListener('click', async () => {
            const url = urlInput.value.trim();
            if (!url) return;
            try {
                showError('');
                const res = await fetch(url);
                if (!res.ok) throw new Error('ファイルの取得に失敗しました');
                const text = await res.text();
                parseAndRender(text);
            } catch (err) {
                showError(err.message);
            }
        });

        function loadFile(file) {
            const reader = new FileReader();
            reader.onload = e => {
                parseAndRender(e.target.result);
            };
            reader.readAsText(file);
        }

        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.classList.toggle('hidden', !msg);
        }

        async function parseAndRender(content) {
            try {
                currentQuiz = await window.MultiQuizScanner.parse(content);
                userAnswers = {};
                renderQuiz();
                quizContainer.classList.remove('hidden');
                showError('');
            } catch (err) {
                showError('解析エラー: ' + err.message);
                console.error(err);
            }
        }

        function renderQuiz() {
            document.getElementById('quizTitle').textContent = currentQuiz.title || 'Untitled Quiz';
            document.getElementById('quizDescription').textContent = currentQuiz.description || '';

            const sectionsDiv = document.getElementById('sections');
            sectionsDiv.innerHTML = '';

            currentQuiz.sections.forEach((section, secIdx) => {
                const sectionEl = document.createElement('div');
                sectionEl.className = 'section';
                sectionEl.innerHTML = `<h3>${section.title}</h3>`;

                section.questions.forEach((q, qIdx) => {
                    const globalQIdx = `${secIdx}-${qIdx}`;
                    const qEl = document.createElement('div');
                    qEl.className = 'question';
                    qEl.innerHTML = `
                        <div class="question-header">
                            <span class="q-number">Q${qIdx + 1}</span>
                            <span class="points">(${q.points}点)</span>
                        </div>
                        <div class="question-text">${q.question}</div>
                        <div class="answers" id="answers-${globalQIdx}"></div>
                        ${q.note ? `<div class="note hidden" id="note-${globalQIdx}">解説: ${q.note}</div>` : ''}
                    `;

                    const answersContainer = qEl.querySelector(`#answers-${globalQIdx}`);
                    renderQuestionInput(q, answersContainer, globalQIdx);

                    sectionsDiv.appendChild(qEl);
                });

                sectionsDiv.appendChild(sectionEl);
            });
        }

        function renderQuestionInput(q, container, globalQIdx) {
            const type = q.type;

            if (type === 'single') {
                q.options.forEach((opt, i) => {
                    const label = document.createElement('label');
                    label.className = 'option';
                    label.innerHTML = `
                        <input type="radio" name="q-${globalQIdx}" value="${i}">
                        ${opt}
                    `;
                    label.querySelector('input').addEventListener('change', e => {
                        userAnswers[globalQIdx] = parseInt(e.target.value);
                    });
                    container.appendChild(label);
                });
            }
            else if (type === 'multiple') {
                q.options.forEach((opt, i) => {
                    const label = document.createElement('label');
                    label.className = 'option';
                    label.innerHTML = `
                        <input type="checkbox" value="${i}">
                        ${opt}
                    `;
                    label.querySelector('input').addEventListener('change', () => {
                        const checked = Array.from(container.querySelectorAll('input:checked'))
                                           .map(cb => parseInt(cb.value));
                        userAnswers[globalQIdx] = checked;
                    });
                    container.appendChild(label);
                });
            }
            else if (type === 'truefalse') {
                const tfDiv = document.createElement('div');
                tfDiv.className = 'truefalse';
                tfDiv.innerHTML = `
                    <label><input type="radio" name="q-${globalQIdx}" value="true"> True</label>
                    <label><input type="radio" name="q-${globalQIdx}" value="false"> False</label>
                `;
                tfDiv.querySelectorAll('input').forEach(radio => {
                    radio.addEventListener('change', e => {
                        userAnswers[globalQIdx] = e.target.value === 'true';
                    });
                });
                container.appendChild(tfDiv);
            }
            else if (type === 'input') {
                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = '回答を入力...';
                input.addEventListener('input', e => {
                    userAnswers[globalQIdx] = e.target.value.trim();
                });
                container.appendChild(input);
            }
            else if (type === 'fill') {
                // Simple fill-in-the-blank display (advanced replacement needs DOM manipulation)
                const fillDiv = document.createElement('div');
                fillDiv.innerHTML = `<p>穴埋め問題（${Object.keys(q.blanks).length}箇所）</p>`;
                Object.keys(q.blanks).forEach(key => {
                    const inp = document.createElement('input');
                    inp.type = 'text';
                    inp.placeholder = `[[${key}]]`;
                    inp.dataset.key = key;
                    inp.addEventListener('input', () => {
                        if (!userAnswers[globalQIdx]) userAnswers[globalQIdx] = {};
                        userAnswers[globalQIdx][key] = inp.value.trim();
                    });
                    fillDiv.appendChild(inp);
                });
                container.appendChild(fillDiv);
            }
            else if (type === 'sort') {
                const ul = document.createElement('ul');
                ul.className = 'sortable';
                q.items.forEach(item => {
                    const li = document.createElement('li');
                    li.draggable = true;
                    li.textContent = item;
                    li.dataset.value = item;
                    ul.appendChild(li);
                });
                makeSortable(ul);
                container.appendChild(ul);
                userAnswers[globalQIdx] = [...q.items]; // initial order
            }
            else if (type === 'matching') {
                const matchDiv = document.createElement('div');
                matchDiv.className = 'matching';
                q.left.forEach((leftItem, i) => {
                    const row = document.createElement('div');
                    row.className = 'match-row';
                    row.innerHTML = `
                        <span>${leftItem}</span>
                        <select data-index="${i}">
                            <option value="">選択...</option>
                            ${q.right.map((r, j) => `<option value="${j}">${r}</option>`).join('')}
                        </select>
                    `;
                    row.querySelector('select').addEventListener('change', e => {
                        if (!userAnswers[globalQIdx]) userAnswers[globalQIdx] = [];
                        userAnswers[globalQIdx][i] = parseInt(e.target.value);
                    });
                    matchDiv.appendChild(row);
                });
                container.appendChild(matchDiv);
            }
        }

        function makeSortable(ul) {
            ul.addEventListener('dragstart', e => {
                e.dataTransfer.setData('text/plain', e.target.dataset.value);
                e.target.classList.add('dragging');
            });
            ul.addEventListener('dragend', e => {
                e.target.classList.remove('dragging');
            });
            ul.addEventListener('dragover', e => e.preventDefault());
            ul.addEventListener('drop', e => {
                e.preventDefault();
                const value = e.dataTransfer.getData('text/plain');
                const dragging = ul.querySelector('.dragging');
                const target = e.target.closest('li');
                if (target && dragging) {
                    if (target !== dragging) {
                        const allItems = Array.from(ul.children);
                        const fromIdx = allItems.indexOf(dragging);
                        const toIdx = allItems.indexOf(target);
                        if (fromIdx < toIdx) target.after(dragging);
                        else target.before(dragging);
                    }
                }
                // Update answer
                const parentQ = ul.closest('.question');
                const globalIdx = parentQ.querySelector('.answers').id.replace('answers-', '');
                userAnswers[globalIdx] = Array.from(ul.children).map(li => li.dataset.value);
            });
        }

        // Submit
        document.getElementById('submitAllBtn').addEventListener('click', () => {
            if (!currentQuiz) return;
            let score = 0;
            let total = 0;

            currentQuiz.sections.forEach((section, secIdx) => {
                section.questions.forEach((q, qIdx) => {
                    const globalQIdx = `${secIdx}-${qIdx}`;
                    const answer = userAnswers[globalQIdx];
                    total += q.points;

                    let isCorrect = false;

                    if (q.type === 'single') {
                        isCorrect = parseInt(answer) === q.correct;
                    } else if (q.type === 'multiple') {
                        isCorrect = JSON.stringify(answer.sort((a,b)=>a-b)) === JSON.stringify(q.correct.sort((a,b)=>a-b));
                    } else if (q.type === 'truefalse') {
                        isCorrect = answer === q.correct;
                    } else if (q.type === 'input') {
                        const userAns = String(answer || '').toLowerCase().trim();
                        const correctAns = String(q.correct).toLowerCase().trim();
                        isCorrect = q.caseSensitive ? answer === q.correct : userAns === correctAns;
                    } else if (q.type === 'fill') {
                        isCorrect = Object.keys(q.blanks).every(key => 
                            (answer && answer[key] && answer[key].trim()) === q.blanks[key]
                        );
                    } else if (q.type === 'sort') {
                        isCorrect = JSON.stringify(answer) === JSON.stringify(q.correct);
                    } else if (q.type === 'matching') {
                        isCorrect = JSON.stringify(answer) === JSON.stringify(q.correct);
                    }

                    if (isCorrect) score += q.points;

                    // Show note
                    const noteEl = document.getElementById(`note-${globalQIdx}`);
                    if (noteEl) noteEl.classList.remove('hidden');
                });
            });

            alert(`採点完了！\n${score} / ${total} 点`);
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            if (confirm('本当にリセットしますか？')) {
                location.reload();
            }
        });
    </script>
</body>
</html>
