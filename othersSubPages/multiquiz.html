<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マルチクイズ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>マルチクイズ</h1>

        <div id="loadSection">
            <input type="text" id="urlInput" placeholder="URLを入力" style="width:70%">
            <button onclick="loadFromURL()">読み込む</button>
            <input type="file" id="fileInput" accept=".multiquiz">
        </div>

        <div id="quizSection" style="display:none;">
            <div id="quizContainer"></div>
            <button onclick="checkAnswers()">解答確認</button>
        </div>
    </div>

    <script type="module">
        import { loadQuizFile } from './scanner.js';

        let quizzes = [];

        async function loadFromURL() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return alert('URLを入力');
            const data = await loadQuizFile(url);
            quizzes = data.quizzes || [];
            render();
        }

        document.getElementById('fileInput').addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const data = await loadQuizFile(ev.target.result, false);
                quizzes = data.quizzes || [];
                render();
            };
            reader.readAsText(file);
        });

        function render() {
            document.getElementById('loadSection').style.display = 'none';
            document.getElementById('quizSection').style.display = 'block';

            const container = document.getElementById('quizContainer');
            container.innerHTML = '<h2>問題一覧</h2>';

            quizzes.forEach((q, i) => {
                const div = document.createElement('div');
                div.style.margin = '20px 0';
                div.style.padding = '15px';
                div.style.border = '1px solid #ddd';
                div.innerHTML = `
                    <strong>${i+1}. ${q.question}</strong><br>
                    ${q.options ? q.options.map((o, j) => `<div>${o}</div>`).join('') : ''}
                    ${q.type === 'input' ? '<input type="text" style="width:100%; margin-top:10px;">' : ''}
                `;
                container.appendChild(div);
            });
        }

        function checkAnswers() {
            alert('解答確認機能は現在開発中です');
        }
    </script>
</body>
</html>
