<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マルチクイズ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>マルチクイズ</h1>

        <div id="loadSection">
            <div class="input-group">
                <input type="text" id="urlInput" placeholder="URLを入力" style="width:70%">
                <button onclick="loadURL()">URL読み込み</button>
            </div>
            <div class="upload-area">
                <input type="file" id="fileInput" accept=".multiquiz">
            </div>
        </div>

        <div id="quizSection" style="display:none;">
            <div id="quizContainer"></div>
        </div>
    </div>

    <script type="module">
        import { loadQuizFile } from './scanner.js';

        let quizzes = [];

        document.getElementById('fileInput').addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const data = await loadQuizFile(ev.target.result, false);
                quizzes = data.quizzes;
                renderQuizzes();
            };
            reader.readAsText(file);
        });

        async function loadURL() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return alert('URLを入力してください');
            const data = await loadQuizFile(url);
            quizzes = data.quizzes;
            renderQuizzes();
        }

        function renderQuizzes() {
            document.getElementById('loadSection').style.display = 'none';
            const container = document.getElementById('quizContainer');
            container.innerHTML = '<h2>問題一覧</h2>';

            quizzes.forEach((q, i) => {
                const div = document.createElement('div');
                div.className = 'quiz-item';
                div.innerHTML = `<strong>${i+1}. ${q.question}</strong><br>`;

                if (q.options) {
                    q.options.forEach(opt => {
                        div.innerHTML += `<div class="option">${opt}</div>`;
                    });
                } else if (q.type === "input") {
                    div.innerHTML += `<input type="text" placeholder="答えを入力">`;
                }

                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
