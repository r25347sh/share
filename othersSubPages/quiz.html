<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マルチクイズ - 選択＋並び替え</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .input-group { margin: 15px 0; }
        input[type="text"] { width: 100%; padding: 12px; font-size: 1em; border: 2px solid #ddd; border-radius: 8px; }
        button { padding: 12px 20px; margin-right: 8px; font-size: 1em; border: none; border-radius: 8px; cursor: pointer; }
        .btn-primary { background: #007bff; color: white; }
        .btn-success { background: #28a745; color: white; }
        .upload-area { border: 2px dashed #aaa; padding: 40px; text-align: center; border-radius: 10px; margin: 20px 0; cursor: pointer; }
        .quiz-item { margin-bottom: 40px; padding: 25px; border: 2px solid #e0e0e0; border-radius: 12px; background: #fafafa; }
        .question { font-size: 1.25em; margin-bottom: 15px; font-weight: bold; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option { padding: 14px; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; }
        .option:hover { background: #f0f8ff; border-color: #4a90e2; }
        .option.selected { background: #e3f2fd; border-color: #2196f3; font-weight: bold; }
        .sort-list { list-style: none; padding: 0; }
        .sort-item { padding: 12px; background: #fff; border: 2px solid #ccc; margin: 6px 0; border-radius: 6px; cursor: move; }
        .note { margin-top: 15px; padding: 12px; background: #fff3cd; border-radius: 6px; display: none; }
        .progress { text-align: center; font-size: 1.2em; margin: 20px 0; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 マルチクイズ（選択＋並び替え）</h1>

        <div id="loadSection">
            <h2>クイズを読み込む</h2>
            
            <div class="input-group">
                <label><strong>① URL直接入力</strong></label>
                <input type="text" id="urlInput" placeholder="https://example.com/quiz.multiquiz" />
                <button class="btn-primary" onclick="loadFromURL()">読み込む</button>
            </div>

            <div class="input-group">
                <label><strong>② クイズID</strong> (LINK.js)</label>
                <input type="text" id="quizIdInput" placeholder="systan1901" />
                <button class="btn-primary" onclick="loadFromID()">IDから読み込む</button>
            </div>

            <div class="upload-area" id="dropArea">
                <p><strong>③ ローカルファイル</strong></p>
                <input type="file" id="fileInput" accept=".multiquiz" style="display:none;">
                <button onclick="document.getElementById('fileInput').click()">ファイルを選択</button>
            </div>
        </div>

        <div id="quizSection" style="display:none;">
            <div class="progress" id="progress"></div>
            <div id="quizContainer"></div>
            
            <div style="text-align:center; margin:30px 0;">
                <button class="btn-success" onclick="checkAllAnswers()">解答確認</button>
                <button onclick="location.reload()">別のクイズを読み込む</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== LINK.js ====================
        const LINKS = {
            "systan1901": "https://your-domain.com/quizzes/systan_multiquiz_1901-2027.multiquiz",
            // ここに追加
        };

        let quizzes = [];
        let currentAnswers = [];

        function parseMultiquiz(text) {
            quizzes = [];
            const lines = text.trim().split(/\r?\n/);
            
            lines.forEach(line => {
                if (!line.trim() || line.startsWith('//')) return;
                
                const parts = [];
                let current = '';
                let inQuote = false;
                
                for (let char of line) {
                    if (char === '"') inQuote = !inQuote;
                    else if (char === ',' && !inQuote) {
                        parts.push(current.trim());
                        current = '';
                    } else if (char === ';' && !inQuote) {
                        // 無視
                    } else {
                        current += char;
                    }
                }
                if (current) parts.push(current.trim());

                if (parts.length < 4) return;

                const question = parts[0].replace(/^"|"$/g, '');
                const correct = parts[1].replace(/^"|"$/g, '');
                const note = parts[2].replace(/^"|"$/g, '');
                const typeMatch = parts[3].match(/type:"(\w+)"/);
                const type = typeMatch ? typeMatch[1] : 'select';

                let options = [];
                for (let i = 4; i < parts.length; i++) {
                    let opt = parts[i].replace(/^"|"$/g, '');
                    if (opt) options.push(opt);
                }

                if (question && correct) {
                    quizzes.push({ question, correct, note, type, options });
                }
            });
        }

        function renderQuizzes() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';
            currentAnswers = new Array(quizzes.length).fill(null);

            quizzes.forEach((quiz, i) => {
                const div = document.createElement('div');
                div.className = 'quiz-item';
                div.id = `quiz-${i}`;
                
                let content = `<div class="question">${i+1}. ${quiz.question}</div>`;

                if (quiz.type === 'sort') {
                    content += `<ul class="sort-list" id="sort-${i}" ondrop="drop(event)" ondragover="allowDrop(event)">`;
                    quiz.options.forEach((opt, j) => {
                        content += `<li class="sort-item" draggable="true" ondragstart="drag(event)" data-index="${j}">${opt}</li>`;
                    });
                    content += `</ul>`;
                } else {
                    content += `<div class="options" id="options-${i}">`;
                    quiz.options.forEach((opt, j) => {
                        content += `<div class="option" onclick="selectOption(${i}, '${opt}', this)">${opt}</div>`;
                    });
                    content += `</div>`;
                }

                content += `
                    <div class="note" id="note-${i}">${quiz.note}</div>
                    <div class="result" id="result-${i}"></div>
                `;
                div.innerHTML = content;
                container.appendChild(div);
            });

            document.getElementById('progress').textContent = `全 ${quizzes.length} 問`;
        }

        window.selectOption = function(index, selected, element) {
            const parent = element.parentElement;
            parent.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            currentAnswers[index] = selected;
        };

        // 並び替え用ドラッグ＆ドロップ
        window.allowDrop = function(ev) { ev.preventDefault(); };
        window.drag = function(ev) { ev.dataTransfer.setData("text", ev.target.dataset.index); };
        window.drop = function(ev) {
            ev.preventDefault();
            const list = ev.currentTarget;
            const items = Array.from(list.children);
            const fromIndex = parseInt(ev.dataTransfer.getData("text"));
            const toIndex = items.indexOf(ev.target);
            if (fromIndex !== toIndex) {
                const moved = items[fromIndex];
                list.removeChild(moved);
                list.insertBefore(moved, items[toIndex]);
            }
        };

        window.checkAllAnswers = function() {
            let score = 0;
            quizzes.forEach((quiz, i) => {
                const resultEl = document.getElementById(`result-${i}`);
                const noteEl = document.getElementById(`note-${i}`);
                let isCorrect = false;

                if (quiz.type === 'sort') {
                    const currentOrder = Array.from(document.getElementById(`sort-${i}`).children)
                        .map(el => el.textContent.trim()).join(',');
                    isCorrect = currentOrder === quiz.options.join(',');
                } else {
                    isCorrect = currentAnswers[i] === quiz.correct;
                }

                if (isCorrect) {
                    score++;
                    resultEl.innerHTML = `<span style="color:#28a745;">✅ 正解</span>`;
                } else {
                    resultEl.innerHTML = `<span style="color:#dc3545;">❌ 不正解</span> (正解: ${quiz.correct})`;
                }
                noteEl.style.display = 'block';
            });
            alert(`採点結果: ${score} / ${quizzes.length} 正解！`);
        };

        async function loadFromURL() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return alert('URLを入力してください');
            try {
                const res = await fetch(url);
                const text = await res.text();
                parseMultiquiz(text);
                startQuiz();
            } catch (e) { alert('読み込み失敗: ' + e.message); }
        }

        async function loadFromID() {
            const id = document.getElementById('quizIdInput').value.trim();
            if (!id || !LINKS[id]) return alert('IDが見つかりません');
            document.getElementById('urlInput').value = LINKS[id];
            const res = await fetch(LINKS[id]);
            const text = await res.text();
            parseMultiquiz(text);
            startQuiz();
        }

        function startQuiz() {
            if (quizzes.length === 0) return alert('問題がありません');
            document.getElementById('loadSection').style.display = 'none';
            document.getElementById('quizSection').style.display = 'block';
            renderQuizzes();
        }

        // ファイルアップロード & ドラッグ&ドロップ
        document.getElementById('fileInput').addEventListener('change', e => {
            if (e.target.files[0]) readFile(e.target.files[0]);
        });

        const dropArea = document.getElementById('dropArea');
        dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.style.background = '#e3f2fd'; });
        dropArea.addEventListener('dragleave', () => dropArea.style.background = '');
        dropArea.addEventListener('drop', e => {
            e.preventDefault();
            dropArea.style.background = '';
            if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
        });

        function readFile(file) {
            const reader = new FileReader();
            reader.onload = ev => {
                parseMultiquiz(ev.target.result);
                startQuiz();
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
