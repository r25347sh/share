<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>セレクトクイズ - リモート対応</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .input-group { margin: 15px 0; }
        input[type="text"] { width: 100%; padding: 12px; font-size: 1em; border: 2px solid #ddd; border-radius: 8px; }
        button { padding: 12px 20px; margin-right: 8px; font-size: 1em; border: none; border-radius: 8px; cursor: pointer; }
        .btn-primary { background: #007bff; color: white; }
        .btn-success { background: #28a745; color: white; }
        .upload-area { border: 2px dashed #aaa; padding: 40px; text-align: center; border-radius: 10px; margin: 20px 0; cursor: pointer; }
        .quiz-item { margin-bottom: 35px; padding: 20px; border: 2px solid #e0e0e0; border-radius: 10px; }
        .option { padding: 12px 15px; border: 2px solid #ddd; border-radius: 8px; margin: 8px 0; cursor: pointer; }
        .option:hover { background: #f0f8ff; border-color: #4a90e2; }
        .option.selected { background: #e3f2fd; border-color: #2196f3; }
        .option.correct { background: #d4edda; border-color: #28a745; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; }
        .note { margin-top: 15px; padding: 12px; background: #fff3cd; border-radius: 6px; display: none; }
        .progress { text-align: center; font-size: 1.2em; margin: 20px 0; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 セレクトクイズ リモート版</h1>

        <!-- 読み込み方法選択 -->
        <div id="loadSection">
            <h2>クイズを読み込む</h2>
            
            <!-- URL直接入力 -->
            <div class="input-group">
                <label><strong>① 直接URLを入力</strong></label>
                <input type="text" id="urlInput" placeholder="https://example.com/quiz/sample.selectquiz" />
                <button class="btn-primary" onclick="loadFromURL()">URLから読み込む</button>
            </div>

            <!-- ID入力 -->
            <div class="input-group">
                <label><strong>② クイズIDで読み込む</strong> (LINK.js使用)</label>
                <input type="text" id="quizIdInput" placeholder="quiz001" />
                <button class="btn-primary" onclick="loadFromID()">IDから読み込む</button>
            </div>

            <!-- ファイルアップロード -->
            <div class="upload-area" id="dropArea">
                <p><strong>③ ローカルファイル</strong></p>
                <p>ここに .selectquiz ファイルをドラッグ＆ドロップ</p>
                <input type="file" id="fileInput" accept=".selectquiz" style="display:none;">
                <button onclick="document.getElementById('fileInput').click()">ファイルを選択</button>
            </div>
        </div>

        <!-- クイズ表示エリア -->
        <div id="quizSection" style="display:none;">
            <div class="progress" id="progress"></div>
            <div id="quizContainer"></div>
            
            <div style="text-align:center; margin:30px 0;">
                <button class="btn-success" onclick="checkAllAnswers()">解答確認</button>
                <button onclick="location.reload()" style="margin-left:10px;">別のクイズを読み込む</button>
            </div>
        </div>
    </div>

    <script>
        // ============= LINK.js の設定（ここにあなたのリンク情報を書いてください） =============
        const LINKS = {
            "quiz001": "https://your-domain.com/quizzes/quiz001.selectquiz",
            "quiz002": "https://your-domain.com/quizzes/quiz002.selectquiz",
            "sample": "https://example.com/sample.selectquiz",
            // ここにどんどん追加できます
        };

        let quizzes = [];
        let currentAnswers = [];

        // パース関数（前回と同じ）
        function parseSelectQuiz(text) {
            quizzes = [];
            const lines = text.trim().split(/\r?\n/);
            
            lines.forEach(line => {
                if (!line.trim()) return;
                const parts = [];
                let current = '';
                let inQuote = false;
                
                for (let char of line) {
                    if (char === '"') inQuote = !inQuote;
                    else if (char === ',' && !inQuote) {
                        parts.push(current.trim());
                        current = '';
                    } else if (char === ';' && !inQuote) {
                        // 無視
                    } else {
                        current += char;
                    }
                }
                if (current) parts.push(current.trim());

                if (parts.length < 4) return;

                const question = parts[0].replace(/^"|"$/g, '');
                const correct = parts[1].replace(/^"|"$/g, '');
                const note = parts[2].replace(/^"|"$/g, '');
                
                let options = [];
                let foundSelect = false;
                for (let i = 3; i < parts.length; i++) {
                    let opt = parts[i].replace(/^"|"$/g, '');
                    if (opt.includes('select')) { foundSelect = true; continue; }
                    if (foundSelect && opt) options.push(opt);
                }

                if (question && options.length >= 2) {
                    quizzes.push({ question, correct, note, options });
                }
            });
        }

        // URLから読み込み
        async function loadFromURL() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return alert('URLを入力してください');
            
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('ファイル取得失敗');
                const text = await res.text();
                parseSelectQuiz(text);
                startQuiz();
            } catch (e) {
                alert('読み込みに失敗しました: ' + e.message);
            }
        }

        // IDから読み込み
        async function loadFromID() {
            const id = document.getElementById('quizIdInput').value.trim();
            if (!id) return alert('クイズIDを入力してください');
            
            const url = LINKS[id];
            if (!url) return alert(`ID "${id}" が見つかりません。LINKSに登録してください。`);
            
            document.getElementById('urlInput').value = url; // 確認用にURLも表示
            const res = await fetch(url);
            if (!res.ok) throw new Error('ファイル取得失敗');
            const text = await res.text();
            parseSelectQuiz(text);
            startQuiz();
        }

        function startQuiz() {
            if (quizzes.length === 0) return alert('クイズデータがありません');
            document.getElementById('loadSection').style.display = 'none';
            document.getElementById('quizSection').style.display = 'block';
            renderQuizzes();
        }

        function renderQuizzes() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';
            currentAnswers = new Array(quizzes.length).fill(null);

            quizzes.forEach((quiz, i) => {
                const div = document.createElement('div');
                div.className = 'quiz-item';
                div.innerHTML = `
                    <div class="question">${i+1}. ${quiz.question}</div>
                    <div class="options" id="options-${i}"></div>
                    <div class="note" id="note-${i}">${quiz.note}</div>
                    <div class="result" id="result-${i}"></div>
                `;
                container.appendChild(div);

                const optionsDiv = document.getElementById(`options-${i}`);
                quiz.options.forEach((opt, j) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option';
                    optDiv.textContent = opt;
                    optDiv.onclick = () => selectOption(i, j, optDiv);
                    optionsDiv.appendChild(optDiv);
                });
            });

            document.getElementById('progress').textContent = `全 ${quizzes.length} 問`;
        }

        window.selectOption = function(index, optIndex, element) {
            const parent = element.parentElement;
            parent.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            currentAnswers[index] = optIndex;
        };

        window.checkAllAnswers = function() {
            let score = 0;
            quizzes.forEach((quiz, i) => {
                const selected = currentAnswers[i];
                const isCorrect = selected !== null && quiz.options[selected] === quiz.correct;
                const resultEl = document.getElementById(`result-${i}`);
                const noteEl = document.getElementById(`note-${i}`);

                if (isCorrect) {
                    score++;
                    resultEl.innerHTML = `<span style="color:#28a745;">✅ 正解</span>`;
                } else {
                    resultEl.innerHTML = `<span style="color:#dc3545;">❌ 不正解</span> (正解: ${quiz.correct})`;
                }
                noteEl.style.display = 'block';
            });
            alert(`採点結果: ${score} / ${quizzes.length} 正解！`);
        };

        // ファイルアップロード（従来通り）
        document.getElementById('fileInput').addEventListener('change', e => {
            if (e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = ev => {
                    parseSelectQuiz(ev.target.result);
                    startQuiz();
                };
                reader.readAsText(e.target.files[0]);
            }
        });

        // ドラッグ&ドロップ
        const dropArea = document.getElementById('dropArea');
        dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.style.background = '#e3f2fd'; });
        dropArea.addEventListener('dragleave', () => dropArea.style.background = '');
        dropArea.addEventListener('drop', e => {
            e.preventDefault();
            dropArea.style.background = '';
            if (e.dataTransfer.files[0]) {
                const reader = new FileReader();
                reader.onload = ev => {
                    parseSelectQuiz(ev.target.result);
                    startQuiz();
                };
                reader.readAsText(e.dataTransfer.files[0]);
            }
        });
    </script>
</body>
</html>
