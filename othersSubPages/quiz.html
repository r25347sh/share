<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マルチクイズ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎯 マルチクイズ</h1>

        <div id="loadSection">
            <div class="input-group">
                <label><strong>① URLから読み込み</strong></label>
                <input type="text" id="urlInput" placeholder="https://example.com/quiz.multiquiz" />
                <button class="btn-primary" onclick="loadFromURL()">読み込む</button>
            </div>

            <div class="input-group">
                <label><strong>② クイズID</strong></label>
                <input type="text" id="quizIdInput" placeholder="systan1901" />
                <button class="btn-primary" onclick="loadFromID()">IDから読み込む</button>
            </div>

            <div class="upload-area" id="dropArea">
                <p><strong>③ ファイルアップロード</strong></p>
                <input type="file" id="fileInput" accept=".multiquiz" style="display:none;">
                <button onclick="document.getElementById('fileInput').click()">ファイルを選択</button>
            </div>
        </div>

        <div id="quizSection" style="display:none;">
            <div class="progress" id="progress"></div>
            <div id="quizContainer"></div>
            
            <div style="text-align:center; margin-top:40px;">
                <button class="btn-success" onclick="checkAllAnswers()">解答確認</button>
                <button onclick="location.reload()">別のクイズを読み込む</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { loadQuizFile } from './scanner.js';

        let currentQuizData = null;

        async function loadFromURL() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return alert('URLを入力してください');
            try {
                currentQuizData = await loadQuizFile(url);
                startQuiz();
            } catch (e) {
                alert('読み込み失敗: ' + e.message);
            }
        }

        async function loadFromID() {
            const id = document.getElementById('quizIdInput').value.trim();
            // LINKSは必要に応じてここに追加
            alert('ID機能はscanner.js側で実装してください');
        }

        function startQuiz() {
            if (!currentQuizData) return;
            document.getElementById('loadSection').style.display = 'none';
            document.getElementById('quizSection').style.display = 'block';
            renderQuizzes();
        }

        function renderQuizzes() {
            // scanner.jsから取得したデータを使って描画
            const container = document.getElementById('quizContainer');
            container.innerHTML = `<h2>${currentQuizData.title || 'クイズ'}</h2>`;
            // ここに実際の問題描画ロジックを追加してください
            console.log('Quiz Data:', currentQuizData);
        }

        function checkAllAnswers() {
            alert('解答確認機能は実装中です。scanner.jsと連携してください。');
        }

        // ファイルアップロード
        document.getElementById('fileInput').addEventListener('change', e => {
            if (e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = ev => {
                    loadQuizFile(ev.target.result, false).then(data => {
                        currentQuizData = data;
                        startQuiz();
                    });
                };
                reader.readAsText(e.target.files[0]);
            }
        });

        // ドラッグ&ドロップ
        const dropArea = document.getElementById('dropArea');
        dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.style.background = '#e3f2fd'; });
        dropArea.addEventListener('dragleave', () => dropArea.style.background = '');
        dropArea.addEventListener('drop', e => {
            e.preventDefault();
            dropArea.style.background = '';
            if (e.dataTransfer.files[0]) {
                const reader = new FileReader();
                reader.onload = ev => {
                    loadQuizFile(ev.target.result, false).then(data => {
                        currentQuizData = data;
                        startQuiz();
                    });
                };
                reader.readAsText(e.dataTransfer.files[0]);
            }
        });
    </script>
</body>
</html>
