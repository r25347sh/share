<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マルチクイズ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎯 マルチクイズ</h1>

        <div id="loadSection">
            <div class="input-group">
                <label><strong>① URLから読み込み</strong></label>
                <input type="text" id="urlInput" placeholder="https://example.com/quiz.multiquiz" />
                <button class="btn-primary" onclick="loadFromURL()">読み込む</button>
            </div>

            <div class="upload-area" id="dropArea">
                <p><strong>② ファイルアップロード</strong></p>
                <input type="file" id="fileInput" accept=".multiquiz" style="display:none;">
                <button onclick="document.getElementById('fileInput').click()">ファイルを選択</button>
            </div>
        </div>

        <div id="quizSection" style="display:none;">
            <div class="progress" id="progress"></div>
            <div id="quizContainer"></div>
            
            <div style="text-align:center; margin-top:40px;">
                <button class="btn-success" onclick="checkAllAnswers()">解答確認</button>
                <button onclick="location.reload()">別のクイズを読み込む</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { loadQuizFile } from './scanner.js';

        let currentQuizData = null;

        async function loadFromURL() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return alert('URLを入力してください');
            try {
                currentQuizData = await loadQuizFile(url);
                startQuiz();
            } catch (e) {
                alert('読み込み失敗: ' + e.message);
            }
        }

        function startQuiz() {
            if (!currentQuizData || !currentQuizData.quizzes || currentQuizData.quizzes.length === 0) {
                return alert('問題データが見つかりませんでした');
            }
            document.getElementById('loadSection').style.display = 'none';
            document.getElementById('quizSection').style.display = 'block';
            renderQuizzes();
        }

        function renderQuizzes() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = `
                <h2>${currentQuizData.title || 'クイズ'}</h2>
                <p>${currentQuizData.description || ''}</p>
            `;

            currentQuizData.quizzes.forEach((quiz, index) => {
                const div = document.createElement('div');
                div.className = 'quiz-item';
                div.innerHTML = `<div class="question">${index + 1}. ${quiz.question}</div>`;

                if (quiz.type === "single") {
                    let html = '<div class="options">';
                    quiz.options.forEach((opt, i) => {
                        html += `<div class="option" onclick="selectOption(${index}, ${i}, this)">${opt}</div>`;
                    });
                    html += '</div>';
                    div.innerHTML += html;
                } else if (quiz.type === "input") {
                    div.innerHTML += `<input type="text" class="input-answer" id="input-${index}" placeholder="答えを入力">`;
                } else if (quiz.type === "sort") {
                    let html = `<ul class="sort-list" id="sort-${index}">`;
                    quiz.items.forEach(item => {
                        html += `<li class="sort-item" draggable="true">${item}</li>`;
                    });
                    html += '</ul>';
                    div.innerHTML += html;
                }

                div.innerHTML += `
                    <div class="note" id="note-${index}">${quiz.note || ''}</div>
                    <div class="result" id="result-${index}"></div>
                `;
                container.appendChild(div);
            });

            document.getElementById('progress').textContent = `全 ${currentQuizData.quizzes.length} 問`;
        }

        window.selectOption = function(qIndex, optIndex, el) {
            const parent = el.parentElement;
            parent.querySelectorAll('.option').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
        };

        window.checkAllAnswers = function() {
            alert('現在解答確認機能を実装中です。');
        };

        // ファイルアップロード
        document.getElementById('fileInput').addEventListener('change', e => {
            if (e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = ev => {
                    loadQuizFile(ev.target.result, false).then(data => {
                        currentQuizData = data;
                        startQuiz();
                    }).catch(err => alert(err.message));
                };
                reader.readAsText(e.target.files[0]);
            }
        });

        // ドラッグ&ドロップ
        const dropArea = document.getElementById('dropArea');
        dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.style.background = '#e3f2fd'; });
        dropArea.addEventListener('dragleave', () => dropArea.style.background = '');
        dropArea.addEventListener('drop', e => {
            e.preventDefault();
            dropArea.style.background = '';
            if (e.dataTransfer.files[0]) {
                const reader = new FileReader();
                reader.onload = ev => {
                    loadQuizFile(ev.target.result, false).then(data => {
                        currentQuizData = data;
                        startQuiz();
                    });
                };
                reader.readAsText(e.dataTransfer.files[0]);
            }
        });
    </script>
</body>
</html>
