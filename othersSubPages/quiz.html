<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マルチクイズ</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; }
        .upload-area { border: 2px dashed #aaa; padding: 40px; text-align: center; border-radius: 10px; margin: 20px 0; cursor: pointer; }
        .quiz-item { margin-bottom: 40px; padding: 25px; border: 2px solid #e0e0e0; border-radius: 12px; }
        .question { font-size: 1.25em; font-weight: bold; margin-bottom: 15px; }
        button { padding: 10px 18px; margin: 5px; border-radius: 8px; cursor: pointer; }
        .btn-success { background: #28a745; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 マルチクイズ</h1>

        <div id="loadSection">
            <div class="upload-area" id="dropArea">
                <p><strong>.multiquiz ファイルを読み込む</strong></p>
                <input type="file" id="fileInput" accept=".multiquiz" style="display:none;">
                <button onclick="document.getElementById('fileInput').click()">ファイルを選択</button>
            </div>
        </div>

        <div id="quizSection" style="display:none;">
            <h2 id="quizTitle"></h2>
            <div id="quizContainer"></div>
            <div style="text-align:center; margin:30px;">
                <button class="btn-success" onclick="checkAnswers()">解答確認</button>
            </div>
        </div>
    </div>

    <script src="scanner.js"></script>
    <script>
        let currentQuizzes = [];

        // ファイル読み込み
        document.getElementById('fileInput').addEventListener('change', e => {
            if (e.target.files[0]) loadFile(e.target.files[0]);
        });

        const dropArea = document.getElementById('dropArea');
        dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.style.background = '#e3f2fd'; });
        dropArea.addEventListener('dragleave', () => dropArea.style.background = '');
        dropArea.addEventListener('drop', e => {
            e.preventDefault();
            dropArea.style.background = '';
            if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
        });

        async function loadFile(file) {
            const text = await file.text();
            const result = scanMultiquiz(text);   // scanner.js の関数を呼ぶ
            
            if (result.error) {
                alert("エラー: " + result.error);
                return;
            }

            currentQuizzes = result.quizzes;
            document.getElementById('quizTitle').textContent = result.title || "クイズ";
            document.getElementById('loadSection').style.display = 'none';
            document.getElementById('quizSection').style.display = 'block';
            
            renderQuizzes();
        }

        function renderQuizzes() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';

            currentQuizzes.forEach((q, index) => {
                // scanner.js側でrenderQuestionHTML関数を作っておく想定
                const html = renderQuestionHTML(q, index);
                container.innerHTML += html;
            });
        }

        window.checkAnswers = () => {
            let score = 0;
            // ここに採点ロジック（scanner.jsに移動してもOK）
            alert("採点機能はscanner.js側で拡張してください");
        };
    </script>
</body>
</html>
